name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Least privilege by default. A job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, never runs on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Owner, for dbmate. Services and integration tests use APP_DATABASE_URL.
  DATABASE_URL: postgres://fwcoach:fwcoach@localhost:5432/fwcoach?sslmode=disable
  APP_DATABASE_URL: postgres://fwcoach_api:fwcoach_api@localhost:5432/fwcoach?sslmode=disable
  DBMATE_MIGRATIONS_DIR: ./db/migrations
  DBMATE_NO_DUMP_SCHEMA: 'true'

jobs:
  lint:
    name: lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm lint:content
      - run: pnpm lint:deps
      - run: pnpm lint:rules
      - run: pnpm lint:unused
      - run: pnpm typecheck
      # docs/openapi.json is generated from the contracts. Fail if it is stale.
      - run: pnpm gen:openapi
      - run: git diff --exit-code docs/openapi.json

  test:
    name: unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 24 is what we ship. 22 is the oldest LTS engineers may still have.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - name: upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  db:
    name: migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fwcoach
          POSTGRES_PASSWORD: fwcoach
          POSTGRES_DB: fwcoach
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fwcoach -d fwcoach"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: create the service user, as db/init does in compose
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init/01-service-user.sql
      - name: apply every migration
        run: pnpm exec dbmate --wait up
      - name: roll every migration back
        # Proves each down undoes its up. dbmate rolls back one at a time.
        run: |
          while pnpm exec dbmate status | grep -q '^\[X\]'; do
            pnpm exec dbmate rollback
          done
          pnpm exec dbmate status
      - name: apply again from empty
        run: pnpm exec dbmate up
      - run: pnpm test:int
      - name: back up, restore into a new database, compare
        # Proves docs/runbooks/backup-restore.md. The runner's pg_dump is
        # older than the server and refuses to dump it, so the scripts run in
        # the server's image. The probe table checks that rows, grants and
        # the append_only trigger all survive the round trip.
        env:
          SOURCE_DATABASE_URL: ${{ env.DATABASE_URL }}
          RESTORE_URL: postgres://fwcoach:fwcoach@localhost:5432/fwcoach_restore?sslmode=disable
        run: |
          pg() { docker run --rm --network host -v "$PWD:/w" -w /w -e DATABASE_URL -e SOURCE_DATABASE_URL postgres:18-alpine "$@"; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'create table app.restore_probe (id int primary key)' \
            -c "select app.append_only('app.restore_probe')" \
            -c 'insert into app.restore_probe select generate_series(1, 100)'
          pg sh scripts/db/backup.sh ci.dump
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'create database fwcoach_restore'
          DATABASE_URL="$RESTORE_URL" pg sh scripts/db/restore.sh ci.dump
          DATABASE_URL="$RESTORE_URL" pg sh scripts/db/compare.sh
          if psql "$RESTORE_URL" -c 'delete from app.restore_probe'; then
            echo "The restored probe table accepted a delete. The append_only trigger did not survive." >&2
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also the check that the service images build.
      - run: docker compose up -d --build --wait
      - run: pnpm test:e2e
      - name: service logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  dashboard-smoke:
    name: dashboard smoke (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter @fwcoach/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @fwcoach/e2e exec playwright install --with-deps chromium
      # The browser is cached, the system libraries it needs are not.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @fwcoach/e2e exec playwright install-deps chromium
      - run: pnpm --filter "@fwcoach/dashboard..." build
      - run: pnpm test:dashboard
      - name: playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so a secret added and then deleted is still caught.
          fetch-depth: 0
      - name: install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --verbose .

  migration-lint:
    name: migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Squawk flags locks and rewrites that are fine on an empty table and an
      # outage on a busy one. Rules and exclusions are in .squawk.toml.
      - run: pnpm lint:migrations

  links:
    name: docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Offline checks relative links and their #anchors. External sites
          # rate limit and go down, which would make this check flaky.
          args: >-
            --offline --include-fragments --hidden --no-progress
            --exclude-path node_modules
            './**/*.md'

  images:
    name: image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only for the SARIF upload to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile
            service: api
          - image: ingest-mock
            dockerfile: Dockerfile
            service: ingest-mock
          - image: dashboard
            dockerfile: apps/dashboard/Dockerfile
            service: ''
    env:
      IMAGE: fwcoach-${{ matrix.image }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          SERVICE: ${{ matrix.service }}
        run: docker build -f "$DOCKERFILE" --build-arg SERVICE="$SERVICE" -t "$IMAGE" .
      # Every finding goes to code scanning, so the unfixable ones stay visible.
      - name: scan for code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: '0'
      # Fork PRs get a read-only token, so the upload would fail for a reason
      # that has nothing to do with the change.
      - name: upload to code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.image }}
      - name: sbom
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 30
      # The gate. Unfixed findings have no action to take, so they do not fail
      # the build. An exception goes in .trivyignore with a reason and expiry.
      - name: fail on fixable high or critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

  alerts:
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same image as the observability compose profile, so CI checks what runs.
      - name: check rules and scrape config
        run: |
          docker run --rm -v "$PWD/ops:/ops:ro" --entrypoint promtool prom/prometheus:v3.5.0 check rules /ops/alerts.yml
          docker run --rm -v "$PWD/ops:/ops:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config --syntax-only /ops/prometheus.yml
      - name: alert unit tests
        run: docker run --rm -v "$PWD/ops:/ops:ro" -w /ops --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts.test.yml

  # The one check branch protection requires. Add new jobs to `needs` and the
  # ruleset never has to change.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, db, build, e2e, dashboard-smoke, secrets, migration-lint, links, images, alerts]
    runs-on: ubuntu-latest
    steps:
      - name: every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
