name: ingest load

# Not part of ci-ok and not a required check: shared runners are noisy, so a
# miss here is a prompt to look, not a merge blocker. See
# docs/runbooks/ingest-load.md.
on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load:
    name: ingest load test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --build --wait
      - run: pnpm test:load
      - name: ingest-mock logs
        if: always()
        run: mkdir -p load-results && docker compose logs --no-color ingest-mock > load-results/ingest-mock.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-results
          path: load-results/
          if-no-files-found: warn
      - if: always()
        run: docker compose down -v
