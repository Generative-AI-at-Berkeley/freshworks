name: Bug
description: Something that behaves differently from what the docs or tests say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected versus actual. Paste the exact error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, harness and version. Use synthetic data only. Never paste real session content.
    validations:
      required: true
