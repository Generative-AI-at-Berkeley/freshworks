name: Ticket
description: A unit of planned work with a clear done condition.
title: '<ID>: '
labels: [ticket]
body:
  - type: input
    id: id
    attributes:
      label: Ticket ID
      description: BE-n (backend and data) or AG-n (agent and integration).
      placeholder: BE-5
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: What to build, and the constraints that matter.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done means
      description: Something a reviewer can check. "Replaying a batch twice stores it once" beats "dedupe works".
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: BE-1, AG-2
