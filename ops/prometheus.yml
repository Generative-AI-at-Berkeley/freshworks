# Local Prometheus for `docker compose --profile observability up`.
# Production scrape config belongs to whoever runs Prometheus there. The
# targets and ports are the same.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:9464']
  - job_name: ingest-mock
    static_configs:
      - targets: ['ingest-mock:9465']
  # Job metrics: the textfile collector reads what jobs/run-job.ts writes.
  - job_name: jobs
    static_configs:
      - targets: ['node-exporter:9100']
